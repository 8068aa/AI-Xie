name: 行情每10分钟更新
on:
  schedule:
    - cron: '3,13,23,33,43,53 1-8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取行情
        run: python3 fetch_data.py || true
      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: quote update $(date +%F_%H%M)" || exit 0
          git push
